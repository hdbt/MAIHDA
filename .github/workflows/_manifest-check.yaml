# TEMPORARY verification workflow (PR-only, no deploy, no secrets).
#
# Reproduces the shiny-deploy job's package environment, then runs
# rsconnect::writeManifest() and asserts every CRAN/RSPM dependency resolves to
# an http(s) source URL - i.e. NOT the bare string "RSPM" that breaks the real
# shinyapps.io build. Lets us confirm the repos fix in shiny-deploy.yaml without
# triggering a production deploy. Delete once the fix is confirmed.
on:
  pull_request:

name: _manifest-check

permissions: read-all

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # same binary source the deploy job uses

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rsconnect
            any::remotes
            any::jsonlite
            any::shiny
            any::bslib
            any::DT
            any::plotly
            any::ggplot2
            any::future
            any::promises
            any::shinyjs
            any::haven
            any::ggtern
            any::MASS

      - name: Install MAIHDA from the PR commit
        shell: Rscript {0}
        run: |
          remotes::install_github(
            paste0("${{ github.repository }}@", "${{ github.event.pull_request.head.sha }}"),
            upgrade = "never", dependencies = TRUE
          )

      - name: Write manifest and assert every repo is a source URL
        shell: Rscript {0}
        run: |
          # Must match the repos block in shiny-deploy.yaml's Deploy step.
          options(repos = c(
            RSPM = "https://packagemanager.posit.co/cran/latest",
            CRAN = "https://cloud.r-project.org"
          ))
          cat("Configured repos:\n"); print(getOption("repos"))

          appdir <- file.path(tempdir(), "app")
          dir.create(appdir)
          file.copy("inst/shiny/app.R", appdir, overwrite = TRUE)
          rsconnect::writeManifest(appDir = appdir)

          m <- jsonlite::fromJSON(file.path(appdir, "manifest.json"),
                                  simplifyVector = FALSE)
          cat("\nPackage repository resolution:\n")
          bad <- character(0)
          for (nm in names(m$packages)) {
            p    <- m$packages[[nm]]
            src  <- if (!is.null(p$Source)) p$Source else "NA"
            repo <- if (!is.null(p$Repository)) p$Repository else "NA"
            cat(sprintf("  %-22s Source=%-10s Repository=%s\n", nm, src, repo))
            # CRAN/RSPM-sourced packages must carry a real URL; GitHub/base
            # packages legitimately have no Repository, so only flag non-URL,
            # non-empty values (e.g. the bare "RSPM" string we are fixing).
            if (repo != "NA" && !grepl("^https?://", repo)) bad <- c(bad, nm)
          }
          if (length(bad)) {
            cat("\n::error::Non-URL Repository for: ", paste(bad, collapse = ", "),
                " - shinyapps.io would fail to fetch these from source.\n", sep = "")
            quit(status = 1)
          }
          cat("\nOK: every package with a Repository resolved to an http(s) source URL.\n")
