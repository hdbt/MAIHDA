name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: checking the package only reads the repository.
permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # Exercise the optional-backend and integration code paths that skip_on_cran()
  # hides from the ordinary R-CMD-check job above -- WeMix (design weights), ordinal
  # (cumulative), negative-binomial (MASS), the response-scale VPC, weighted counts,
  # and the PCV/discriminatory-accuracy estimand regressions. Without this, the
  # statistically riskiest backend-specific code runs only in the on-demand CRAN
  # check. brms is intentionally NOT installed here (its Stan-compiling tests have
  # their own workflow, brms-tests.yaml, and skip via skip_if_not_installed("brms")
  # + the closed MAIHDA_TEST_BRMS gate), keeping this job fast.
  integration-tests:
    runs-on: ubuntu-latest
    name: integration-tests (WeMix / ordinal / MASS, NOT_CRAN)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"   # run the skip_on_cran() backend/integration tests

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::WeMix
            any::ordinal
            any::MASS

      - name: Run the full non-brms test suite (NOT_CRAN = true)
        run: |
          # MAIHDA_TEST_BRMS intentionally left unset and brms not installed, so the
          # Stan-backed tests skip here and run in brms-tests.yaml instead.
          testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}

  CRAN-brms-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(join(github.event.commits.*.message, '\n'), 'CRAN'))
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Both gates must be open for the Stan-backed tests:
      # MAIHDA_TEST_BRMS enables the package's brms opt-in tests, while NOT_CRAN
      # prevents testthat::skip_on_cran() from skipping those slow paths.
      MAIHDA_TEST_BRMS: "true"
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install system tools for CRAN-style checks
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::brms
            any::rstan
            any::BH
            any::StanHeaders
            any::RcppEigen
            any::RcppParallel
            any::Rcpp

      - name: Report environment and Stan backend
        run: |
          cat("MAIHDA_TEST_BRMS=", Sys.getenv("MAIHDA_TEST_BRMS"), "\n", sep = "")
          cat("NOT_CRAN=", Sys.getenv("NOT_CRAN"), "\n", sep = "")
          for (p in c("brms", "rstan", "BH", "StanHeaders", "RcppEigen",
                      "RcppParallel", "Rcpp")) {
            cat(p, " ", as.character(packageVersion(p)), "\n", sep = "")
          }
          boost_inc <- system.file("include", package = "BH")
          if (!nzchar(boost_inc) || !dir.exists(boost_inc)) {
            stop("BH (Boost) headers not found; Stan model compilation would fail.")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'character()'
          check-dir: '"check"'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Show check output on failure
        if: failure()
        run: |
          find check -name '00check.log' -print -exec cat '{}' \; || true
          find check -name 'testthat.Rout*' -print -exec cat '{}' \; || true
        shell: bash
