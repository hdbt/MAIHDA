name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: checking the package only reads the repository.
permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # A newer push to the same branch or pull request cancels this leg of the
    # older run. The group is per leg, since legs sharing a group would cancel
    # each other, and CRAN-brms-check has none, so a later push never cancels it.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.config.os }}-${{ matrix.config.r }}
      cancel-in-progress: true

    # The slow test blocks (tests/testthat/helper-slow-tests.R) run on
    # ubuntu-latest (release) only: skip-slow-tests skips them on the other legs.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release',  skip-slow-tests: 'true'}
          - {os: windows-latest, r: 'release',  skip-slow-tests: 'true'}
          - {os: ubuntu-latest,  r: 'devel',    skip-slow-tests: 'true', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release',  skip-slow-tests: 'false'}
          - {os: ubuntu-latest,  r: 'oldrel-1', skip-slow-tests: 'true'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAIHDA_SKIP_SLOW_TESTS: ${{ matrix.config.skip-slow-tests }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # R CMD check and covr run the tests from the installed package, which has no
  # man/, README or vignettes, so the blocks that read the package's own files
  # through test_path("..", "..") skip there. This job runs the test files that
  # hold such blocks from the source tree. Every other test runs in the legs above.
  source-tree-tests:
    runs-on: ubuntu-latest
    name: tests that read the package tree

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-source-tree-tests
      cancel-in-progress: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"   # the blocks start with skip_on_cran()
      # The ubuntu-latest (release) leg above runs the slow blocks of these files.
      MAIHDA_SKIP_SLOW_TESTS: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Run the test files that read the package tree
        run: |
          # Files are picked by the test_path("..", "..") call, so a new test of
          # this kind runs here without editing the workflow.
          dir <- "tests/testthat"
          files <- list.files(dir, "^test-.*\\.R$")
          reads_tree <- vapply(file.path(dir, files), function(f) {
            any(grepl('test_path("..", ".."', readLines(f, warn = FALSE), fixed = TRUE))
          }, logical(1))
          if (!any(reads_tree)) {
            stop("No test file calls test_path(\"..\", \"..\"); update the pattern.")
          }
          stems <- sub("^test-", "", sub("\\.R$", "", files[reads_tree]))
          cat("Test files that read the package tree:\n",
              paste0("  ", stems, "\n"), sep = "")
          testthat::test_local(
            filter = paste0("^(", paste(stems, collapse = "|"), ")$"),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

  # Publish the bundled Shiny app once every check above has passed on a push to
  # main. The steps live in shiny-deploy.yaml, which can also be run by hand to
  # redeploy without the checks.
  shiny-deploy:
    needs: [R-CMD-check, source-tree-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/shiny-deploy.yaml
    secrets:
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}

  CRAN-brms-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(join(github.event.commits.*.message, '\n'), 'CRAN'))
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Both gates must be open for the Stan-backed tests:
      # MAIHDA_TEST_BRMS enables the package's brms opt-in tests, while NOT_CRAN
      # prevents testthat::skip_on_cran() from skipping those slow paths.
      MAIHDA_TEST_BRMS: "true"
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install system tools for CRAN-style checks
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::brms
            any::rstan
            any::BH
            any::StanHeaders
            any::RcppEigen
            any::RcppParallel
            any::Rcpp

      - name: Report environment and Stan backend
        run: |
          cat("MAIHDA_TEST_BRMS=", Sys.getenv("MAIHDA_TEST_BRMS"), "\n", sep = "")
          cat("NOT_CRAN=", Sys.getenv("NOT_CRAN"), "\n", sep = "")
          for (p in c("brms", "rstan", "BH", "StanHeaders", "RcppEigen",
                      "RcppParallel", "Rcpp")) {
            cat(p, " ", as.character(packageVersion(p)), "\n", sep = "")
          }
          boost_inc <- system.file("include", package = "BH")
          if (!nzchar(boost_inc) || !dir.exists(boost_inc)) {
            stop("BH (Boost) headers not found; Stan model compilation would fail.")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'character()'
          check-dir: '"check"'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Show check output on failure
        if: failure()
        run: |
          find check -name '00check.log' -print -exec cat '{}' \; || true
          find check -name 'testthat.Rout*' -print -exec cat '{}' \; || true
        shell: bash
