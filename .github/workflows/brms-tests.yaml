name: brms-tests

# The Stan-backed (brms) code paths -- the end-to-end Bayesian fit and the
# posterior VPC/ICC summary -- are opt-in for local and CRAN runs because they
# compile a Stan model (slow), so the standard R-CMD-check and test-coverage
# workflows skip them. Without a job that turns them on, the Bayesian path could
# regress silently. This workflow exercises it weekly, on demand, and on pull
# requests that touch package code or the tests/workflow themselves.

on:
  schedule:
    - cron: '17 6 * * 1'   # 06:17 UTC every Monday
  workflow_dispatch:
  # Catch a brms regression at PR time, not only on the weekly run. The path
  # filter keeps doc-only / unrelated PRs from paying the Stan-compile cost.
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - '.github/workflows/brms-tests.yaml'

permissions: read-all

# An expensive (Stan-compiling) job; cancel superseded runs on the same PR/branch.
concurrency:
  group: brms-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brms-tests:
    runs-on: ubuntu-latest
    # A cold runner installs rstan and compiles the Stan models at test time.
    # The whole suite is run with the brms gate open, so every brms-backed test
    # file (cross-classified, contextual, interactions, longitudinal, negbinomial,
    # ordinal, tidiers, fit_maihda, summary_variance) compiles its own Stan model
    # -- roughly nine compiles on a cold runner -- hence the generous budget.
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Both gates must be open or the Stan-backed tests skip themselves:
      #   * MAIHDA_TEST_BRMS -> the brms opt-in skip_if() in the test files
      #   * NOT_CRAN         -> the skip_on_cran() guarding the same tests
      MAIHDA_TEST_BRMS: "true"
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Keep the dependency surface lean and reliable: hard deps only, plus
          # brms + a Stan backend (rstan, the brms default) and the test runner.
          # Listing brms/rstan as required means the job fails fast if they cannot
          # be installed, rather than letting the tests silently skip.
          dependencies: '"hard"'
          extra-packages: |
            any::brms
            any::rstan
            any::testthat
            any::pkgload

      - name: Report environment and Stan backend
        run: |
          cat("MAIHDA_TEST_BRMS=", Sys.getenv("MAIHDA_TEST_BRMS"), "\n", sep = "")
          cat("NOT_CRAN=", Sys.getenv("NOT_CRAN"), "\n", sep = "")
          cat("brms ", as.character(packageVersion("brms")), "\n", sep = "")
          cat("rstan ", as.character(packageVersion("rstan")), "\n", sep = "")
        shell: Rscript {0}

      - name: Run the Stan-backed (brms) tests
        run: |
          # Run the WHOLE suite (no file filter) with MAIHDA_TEST_BRMS and NOT_CRAN
          # open at the job level. The brms opt-in is keyed off MAIHDA_TEST_BRMS in
          # several files beyond fit_maihda / summary_variance -- cross-classified,
          # contextual, interactions, longitudinal, negbinomial, ordinal-engine and
          # tidiers -- and a name/path filter silently excluded those Stan paths,
          # letting them regress green. Running everything exercises every gated
          # path; non-brms optional tests (WeMix, shinytest2, ...) skip cleanly when
          # their package is absent.
          res <- testthat::test_local(
            ".",
            reporter = "summary",
            stop_on_failure = FALSE
          )
          df <- as.data.frame(res)

          # 1) No failures or errors anywhere in the suite.
          if (sum(df$failed) > 0 || any(df$error)) {
            stop(sprintf("Test failures detected (failed=%d, errors=%d).",
                         sum(df$failed), sum(df$error)))
          }

          # 2) Dynamic tripwire: with the brms gate open, NO test gated on
          #    MAIHDA_TEST_BRMS may skip. Walk every expectation and flag any skip
          #    whose reason mentions the opt-in -- that means a Stan path went
          #    unexercised (a new gated file, a drifted gate, a misconfigured env).
          #    This adapts automatically as gated tests are added, with no list to
          #    maintain.
          brms_skips <- character(0)
          for (el in res) {
            for (r in el$results) {
              if (inherits(r, "expectation_skip") &&
                  grepl("MAIHDA_TEST_BRMS", conditionMessage(r), fixed = TRUE)) {
                brms_skips <- c(brms_skips, sprintf("%s :: %s", el$file, el$test))
              }
            }
          }
          if (length(brms_skips) > 0) {
            stop("Stan-backed (brms) test(s) skipped despite MAIHDA_TEST_BRMS=true:\n  ",
                 paste(unique(brms_skips), collapse = "\n  "))
          }

          # 3) Flagship sanity check: the two canonical brms tests must be present
          #    and passed, so a suite that somehow ran zero Stan tests cannot go
          #    green on the skip-tripwire alone.
          gated <- c(
            "fit_maihda fits a binary outcome with brms via bernoulli()",
            "brms summary returns a posterior credible interval for the VPC/ICC"
          )
          status <- vapply(gated, function(nm) {
            row <- df[df$test == nm, , drop = FALSE]
            if (nrow(row) == 0) return("missing")
            if (isTRUE(row$skipped[1])) return("skipped")
            if (row$failed[1] > 0 || isTRUE(row$error[1])) return("failed")
            "passed"
          }, character(1))
          print(data.frame(test = gated, status = status, row.names = NULL))
          if (any(status != "passed")) {
            stop("Canonical Stan-backed brms test(s) did not run and pass: ",
                 paste(sprintf("%s = %s", gated, status), collapse = "; "))
          }

          cat("\nStan-backed brms tests ran and passed.\n")
        shell: Rscript {0}
