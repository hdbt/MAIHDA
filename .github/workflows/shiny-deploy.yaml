# Auto-deploy the bundled Shiny app (inst/shiny/app.R) to shinyapps.io.
#
# Runs on every push to `main` that touches the app or the package, and can also
# be run manually from the Actions tab (workflow_dispatch).
#
# REQUIRED repository secrets (Settings -> Secrets and variables -> Actions):
#   SHINYAPPS_TOKEN   - token  from shinyapps.io -> Account -> Tokens
#   SHINYAPPS_SECRET  - secret from the same token (click "Show secret")
#
# The deploy targets the EXISTING app: account "hdbt", appName "shiny", so it
# updates https://hdbt.shinyapps.io/shiny/ rather than creating a new app.
on:
  push:
    branches: [main]
    paths:
      - 'inst/shiny/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/shiny-deploy.yaml'
  workflow_dispatch:

name: shiny-deploy

# Never let two deploys run at once; a newer push supersedes an in-flight deploy.
concurrency:
  group: shiny-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Lets remotes::install_github() use the Actions token (needed for a private
      # repo; harmless for a public one).
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Pin to an R version shinyapps.io supports on its jammy build image.
          # Leaving this unset installs the latest release (currently 4.6.1), which
          # rsconnect stamps into the deploy manifest; shinyapps.io then rejects the
          # deploy with "Unsupported R version 4.6.1 for operating system jammy".
          # Bump this only once shinyapps.io adds support for the newer version.
          r-version: '4.5.1'
          use-public-rspm: true   # fast pre-built Linux binaries

      # Install the package's hard dependencies plus the extra packages the Shiny
      # app needs at runtime (these live in Suggests, so are not pulled in by the
      # package's Imports alone) and rsconnect/remotes for the deploy itself.
      #
      # The app-runtime packages are listed WITHOUT the any:: prefix on purpose:
      # an explicit any:: ref makes pak stamp the installed package
      # `RemoteType: any`, which stops rsconnect from resolving it via
      # available.packages() at deploy time - it then records the bare string
      # "RSPM" as the repo and shinyapps.io fails to fetch the source. Plain names
      # install identically but keep clean CRAN provenance. Build-only tooling
      # (rsconnect/remotes/testthat/pkgload) is not in the app bundle, so its
      # provenance is irrelevant and it keeps any::.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rsconnect
            any::remotes
            any::testthat
            any::pkgload
            MASS
            shiny
            bslib
            DT
            plotly
            ggplot2
            future
            promises
            shinyjs
            haven
            ggtern

      # Install MAIHDA from THIS commit. Installing via install_github records a
      # GitHub source in the package metadata, so rsconnect tells shinyapps.io to
      # reinstall MAIHDA from GitHub (the development version the app expects)
      # rather than the older CRAN release.
      - name: Install MAIHDA from the pushed commit
        shell: Rscript {0}
        run: |
          remotes::install_github(
            paste0("${{ github.repository }}@", "${{ github.sha }}"),
            upgrade = "never", dependencies = TRUE
          )

      # Gate the deploy: a red test suite, or an app.R that fails to load, must
      # abort the job BEFORE anything is published. The smoke test sources app.R,
      # which runs its top-level code (library() calls, UI/server construction) and
      # so catches errors the helper unit tests do not exercise.
      - name: Test the package and smoke-test the app
        shell: Rscript {0}
        run: |
          testthat::test_local(stop_on_failure = TRUE)
          app <- source("inst/shiny/app.R")$value
          stopifnot(inherits(app, "shiny.appobj"))
          cat("App built successfully:", class(app)[1], "\n")

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          # Make rsconnect record source-fetchable repo URLs in the bundle manifest.
          #
          # use-public-rspm installs binaries from Posit Package Manager, so every
          # dep's DESCRIPTION carries `Repository: RSPM`. rsconnect resolves that by
          # NAME against getOption("repos"); if no entry is named "RSPM" it writes the
          # bare string "RSPM", and shinyapps.io - which rebuilds every package FROM
          # SOURCE - dies with "Unsupported url scheme: RSPM/src/contrib/<pkg>.tar.gz".
          #
          # So map "RSPM" to PPM's *source* endpoint (the binary URL minus the
          # __linux__/<distro>/ segment): same snapshot the binaries came from, so it
          # serves the exact installed versions as source tarballs. CRAN is a fallback
          # for anything rsconnect relates via available.packages() instead of by name.
          options(repos = c(
            RSPM = "https://packagemanager.posit.co/cran/latest",
            CRAN = "https://cloud.r-project.org"
          ))
          rsconnect::setAccountInfo(
            name   = "hdbt",
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir      = "inst/shiny",
            appName     = "shiny",
            account     = "hdbt",
            forceUpdate = TRUE
          )

      # Confirm the freshly deployed app actually serves (catches startup errors
      # that a "successful" deploy can still hide). Retries to allow a cold start.
      - name: Verify the deployed app responds
        run: |
          url="https://hdbt.shinyapps.io/shiny/"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "App is live."; exit 0; fi
            sleep 20
          done
          echo "::error::App did not return HTTP 200 after deploy ($url)"
          exit 1
