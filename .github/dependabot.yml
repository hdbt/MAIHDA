version: 2
updates:
  # Keep GitHub Actions current. Actions are pinned to commit SHAs for supply-chain
  # immutability (a mutable tag can be moved to point at compromised code); Dependabot
  # opens reviewed PRs that bump those SHAs and their version comments, so pinning does
  # not mean the actions silently rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
